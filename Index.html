
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Product Store</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body>

  <header>
    <h1>My Store</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#products">Products</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Discover Your Style</h2>
    <p>Explore our latest collection.</p>
  </section>

  <main id="products">
    <h2>Our Products</h2>

    <div class="product-grid">
      <article class="product-card">
        <img src="images/shirt.jpg" alt="Shirt">
        <h3>Casual Shirt</h3>
        <p>₹499</p>
        <button type="button">View Product</button>
      </article>

      <article class="product-card">
        <img src="images/shoes.jpg" alt="Shoes">
        <h3>Sports Shoes</h3>
        <p>₹999</p>
        <button type="button">View Product</button>
      </article>

      <article class="product-card">
        <img src="images/watch.jpg" alt="Watch">
        <h3>Classic Watch</h3>
        <p>₹799</p>
        <button type="button">View Product</button>
      </article>

      <article class="product-card">
        <img src="images/bag.jpg" alt="Bag">
        <h3>Travel Bag</h3>
        <p>₹699</p>
        <button type="button">View Product</button>
      </article>
    </div>
  </main>

  <footer id="about">
    <p>© 2026 My Store</p>
  </footer>

</body>
</html>
